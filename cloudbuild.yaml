steps:
  - name: ubuntu:22.04
    id: package-linux-appimage
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates \
          cmake \
          file \
          g++ \
          git \
          libdbus-1-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libgl1-mesa-dev \
          libglib2.0-0 \
          libfuse2 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxkbcommon-dev \
          libxkbcommon-x11-0 \
          make \
          python3 \
          python3-pip \
          wget
        python3 -m pip install --no-cache-dir aqtinstall
        python3 -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 -O /opt/Qt --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
        export CMAKE_PREFIX_PATH=/opt/Qt/6.7.3/gcc_64
        export PATH=/opt/Qt/6.7.3/gcc_64/bin:$$PATH
        ./scripts/package-linux-appimage.sh

  - name: gcr.io/cloud-builders/gcloud
    id: publish-github-release
    entrypoint: bash
    env:
      - TAG_NAME=$TAG_NAME
      - _GITHUB_REPO=$_GITHUB_REPO
    secretEnv:
      - GITHUB_TOKEN
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl jq
        ./scripts/publish-github-release.sh

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-release-token/versions/latest
      env: GITHUB_TOKEN

substitutions:
  _GITHUB_REPO: zmcgill7/Solitaire

options:
  logging: CLOUD_LOGGING_ONLY
